<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaradh Web | Unified Premium Packages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #09090b; color: #fafafa; overflow-x: hidden; }
        .glass-panel { background: rgba(9, 9, 11, 0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-card { background: linear-gradient(145deg, rgba(39, 39, 42, 0.4) 0%, rgba(24, 24, 27, 0.6) 100%); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .glass-card-interactive:hover { border: 1px solid rgba(59, 130, 246, 0.5); transform: translateY(-8px) scale(1.02); background: linear-gradient(145deg, rgba(39, 39, 42, 0.7) 0%, rgba(24, 24, 27, 0.9) 100%); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
        .gradient-text-blue { background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #2563eb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tier-starter { border-top: 3px solid #3b82f6; }
        .tier-standard { border-top: 3px solid #a855f7; }
        .tier-premium { border-top: 3px solid #f59e0b; }
        .btn-hover-fx { transition: all 0.3s ease; }
        .btn-hover-fx:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4); }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 glass-panel">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <span class="text-xl font-800 tracking-tighter text-white">AARADH<span class="text-blue-500 font-400">WEB</span></span>
            <a href="https://wa.me/917764812598" class="text-white bg-white/10 px-5 py-2 rounded-full text-sm font-semibold">Let's Talk</a>
        </div>
    </nav>

    <main class="pt-32 pb-24 px-6 min-h-screen flex flex-col items-center">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-6xl font-800 mb-6 tracking-tight text-white">Our Unified Packages</h1>
            <p class="text-zinc-400 text-lg">Pick the outcome your business needs.</p>
        </div>

        <div id="app-root" class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Tiers injected via JS below -->
        </div>
    </main>

    <script>
        const tiers = [
            { tier: "starter", name: "Digital Identity", price: "2,999", d: "You exist online & build local trust.", features: ["Mobile-responsive Site", "Direct WhatsApp CTA", "Google Maps Integration", "10-Photo Gallery", "Contact Form"] },
            { tier: "standard", name: "Growth Engine", price: "5,999", d: "You capture leads, bookings, & orders.", features: ["Everything in Starter", "Lead Capture/Booking Form", "Enquiry Dashboard", "Local SEO Optimization", "Fast Load Speed"] },
            { tier: "premium", name: "Business OS", price: "9,999", d: "You automate your day-to-day operations.", features: ["Everything in Growth Engine", "WhatsApp Auto-responders", "Premium Visuals/Video", "Dominant Local SEO", "1-Year Extended Support"] }
        ];

        const appRoot = document.getElementById('app-root');
        appRoot.innerHTML = tiers.map(t => `
            <div class="glass-card rounded-[2rem] p-8 flex flex-col tier-${t.tier}">
                <h3 class="text-zinc-400 text-sm font-bold uppercase tracking-widest mb-2">${t.name}</h3>
                <span class="text-4xl font-800 text-white mb-4">₹${t.price}</span>
                <p class="text-zinc-400 text-sm mb-8">${t.d}</p>
                <ul class="space-y-4 mb-8 flex-grow">
                    ${t.features.map(f => `<li class="text-sm text-zinc-300 flex items-center gap-3"><i class="fas fa-check text-blue-500"></i> ${f}</li>`).join('')}
                </ul>
                <a href="#" class="w-full py-4 rounded-xl bg-blue-600 text-white font-bold text-center">Select ${t.name}</a>
            </div>
        `).join('');
    </script>
</body>
</html>
